services:
  db:
    image: postgres:17
    container_name: tickets-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tickets}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tickets123}
      POSTGRES_DB: ${DB_NAME:-tickets_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tickets_pgdata:
